repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v4.5.0
      hooks:
          - id: trailing-whitespace
          - id: end-of-file-fixer
          - id: check-yaml
          - id: check-merge-conflict

    - repo: local
      hooks:
          # 1. Gitleaks Secret Detection
          # - id: gitleaks
          #   name: 🔐 Gitleaks Secret Detection
          #   entry: gitleaks
          #   args: ["protect", "--staged", "--redact", "--verbose"]
          #   language: system
          #   pass_filenames: false

          # 2. Trivy Filesystem Scan (Block HIGH/CRITICAL)
          - id: trivy-fs
            name: 🛡️ Trivy Filesystem Scan
            entry: bash
            args:
                - -c
                - |
                    if command -v trivy >/dev/null 2>&1; then
                      echo ">>> Scanning for VULNERABILITIES (Blocking HIGH/CRITICAL)..."
                      trivy fs --exit-code 1 --severity HIGH,CRITICAL --format table --scanners vuln,secret,misconfig .
                    else
                      echo "Trivy not installed, skipping."
                    fi
            language: system
            pass_filenames: false

