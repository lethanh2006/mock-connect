include:
  - project: 'vsf-qtvhgd/vinuni/digital-university/devsecops/gitops-dev'
    ref: master
    file: '.gitlab/templates/frontend-vwa.gitlab-ci.yml'
  - project: 'vsf-qtvhgd/vinuni/digital-university/devsecops/gitops-prod'
    ref: master
    file: '.gitlab/templates/frontend-vwa-prod.gitlab-ci.yml'
    rules:
      - if: '$CI_COMMIT_TAG =~ /^release_.+/'

variables:
  ECR_REPO_NAME: "vwa-connect"
  APP_NAME: "dhs-slink-web"
  RESOURCE_GROUP_PREFIX: "vwa-connect"
  ENABLE_SIT_PIPELINE: "1"
  ENABLE_SIT_DEPLOY: "1"
  JFROG_IMAGE_PULL_SECRET: "dhs-jfrog-registry"
  ENABLE_ECR_CREDENTIAL_HELPER: "0"
  DEV_IMAGE_REPOSITORY: "${JFROG_REGISTRY}/${JFROG_IMAGE_REPO}/${APP_NAME}"
  PROD_IMAGE_REPOSITORY: "${JFROG_REGISTRY}/${JFROG_IMAGE_REPO}/${APP_NAME}"
  DEV_BUILD_CACHE_REPO: "${JFROG_REGISTRY}/${JFROG_IMAGE_REPO}/${APP_NAME}-build-cache"
  PROD_BUILD_CACHE_REPO: "${JFROG_REGISTRY}/${JFROG_IMAGE_REPO}/${APP_NAME}-prod-build-cache"
  BUILD_BASE_IMAGE_NAME: "vwa-connect"
  UAT_IMAGE_TAG_SUFFIX: "-uat"
  SIT_IMAGE_TAG_SUFFIX: "-sit"
  ENABLE_UAT_PIPELINE: "1"
  ENABLE_UAT_DEPLOY: "1"
  ENABLE_MR_DEVELOP_BUILD: "1"
