include:
  - project: 'vsf-qtvhgd/vinuni/digital-university/devsecops/gitops-dev'
    ref: master
    file: '.gitlab/templates/frontend-vwa.gitlab-ci.yml'
  - project: 'vsf-qtvhgd/vinuni/digital-university/devsecops/gitops-prod'
    ref: master
    file: '.gitlab/templates/frontend-vwa-prod.gitlab-ci.yml'
  
variables:
  ECR_REPO_NAME: "vwa-connect"
  APP_NAME: "dhs-slink-web"
  RESOURCE_GROUP_PREFIX: "vwa-connect"
  BUILD_BASE_IMAGE_NAME: "vwa-connect"
  ENABLE_UAT_PIPELINE: "1"
  ENABLE_UAT_DEPLOY: "1"
  ENABLE_MR_DEVELOP_BUILD: "1"
