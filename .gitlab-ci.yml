include:
  - project: 'vsf-qtvhgd/vinuni/shared/gitlab-template'
    ref: main
    file: '.gitlab/templates/frontend-vwa.gitlab-ci.yml'
  - project: 'vsf-qtvhgd/vinuni/shared/gitlab-template'
    ref: main
    file: '.gitlab/templates/frontend-vwa-prod.gitlab-ci.yml'
    rules:
      - if: '$CI_COMMIT_TAG =~ /^release_.+/ || $CI_COMMIT_TAG =~ /^build_base_prod.*/'

variables:
  ECR_REPO_NAME: "vwa-connect"
  APP_NAME: "dhs-slink-web"
  RESOURCE_GROUP_PREFIX: "vwa-connect"
  JFROG_REGISTRY: "jfrog.vinsmartfuture.tech"
  JFROG_IMAGE_REPO: "vsf-qtvhgd-vuni-docker-dhs"
  CCP_IMAGE_REPO: "vsf-qtvhgd-vuni-docker-dhs"
  CCP_IMAGE_REPO_PROD: "vsf-qtvhgd-vuni-docker-dhs"
  ENABLE_CCP_BUILD: "1"
  ENABLE_CCP_BUILD_PROD: "1"
  ENABLE_UAT_PIPELINE: "1"
  ENABLE_UAT_DEPLOY: "1"
  ENABLE_SIT_PIPELINE: "1"
  ENABLE_SIT_DEPLOY: "1"
  ENABLE_ECR_CREDENTIAL_HELPER: "0"
  JFROG_IMAGE_PULL_SECRET: "dhs-jfrog-registry"
  PROD_IMAGE_PULL_SECRET: "dhs-jfrog-registry"
  DEV_IMAGE_REPOSITORY: "${JFROG_REGISTRY}/${CCP_IMAGE_REPO}/${APP_NAME}"
  DEV_UPDATE_IMAGE_REPOSITORY: "${JFROG_REGISTRY}/${CCP_IMAGE_REPO}/${APP_NAME}"
  SIT_IMAGE_REPOSITORY: "${JFROG_REGISTRY}/${CCP_IMAGE_REPO}/${APP_NAME}"
  SIT_UPDATE_IMAGE_REPOSITORY: "${JFROG_REGISTRY}/${CCP_IMAGE_REPO}/${APP_NAME}"
  PROD_IMAGE_REPOSITORY: "${JFROG_REGISTRY}/${CCP_IMAGE_REPO_PROD}/${APP_NAME}"
  PROD_UPDATE_IMAGE_REPOSITORY: "${JFROG_REGISTRY}/${CCP_IMAGE_REPO_PROD}/${APP_NAME}"
  DEV_BUILD_CACHE_REPO: "${JFROG_REGISTRY}/${CCP_IMAGE_REPO}/${APP_NAME}-build-cache"
  SIT_BUILD_CACHE_REPO: "${JFROG_REGISTRY}/${CCP_IMAGE_REPO}/${APP_NAME}-build-cache"
  PROD_BUILD_CACHE_REPO: "${JFROG_REGISTRY}/${CCP_IMAGE_REPO_PROD}/${APP_NAME}-prod-build-cache"
  BUILD_BASE_IMAGE_NAME: "vwa-connect-vinuni"
  UAT_IMAGE_TAG_SUFFIX: ""
  SIT_IMAGE_TAG_SUFFIX: ""
  GITOPS_APP_PATH_UAT: "apps/dhs-slink-web"
  GITOPS_APP_PATH_SIT: "apps-sit/dhs-slink-web"
  GITOPS_APP_PATH_PROD: "apps/dhs-slink-web"
